services:
  - type: web
    name: tour-travels-backend
    runtime: node
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO_NAME # Set this to your repository URL
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: ./start.sh
    envVars:
      - key: PORT
        value: 3001
      - key: API_SECRET_KEY
        value: himvigo-super-secret-key-2026
      - key: DATABASE_URL
        value: file:/var/data/tour-travels.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
