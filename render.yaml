services:
  - type: web
    name: tour-travels-backend
    runtime: node
    repo: https://github.com/himvigotravels-ui/Tour-Travels-Backend.git
    buildCommand: npm install
    startCommand: sh start.sh
    envVars:
      - key: PORT
        value: 3001
      - key: API_SECRET_KEY
        value: himvigo-super-secret-key-2026
      # Turso (libsql) — the URL is non-sensitive; the auth token is.
      # Set TURSO_AUTH_TOKEN via Render dashboard → Environment (NOT in
      # this file), so it never lands in git.
      - key: TURSO_DATABASE_URL
        value: libsql://himvigo-himvigo.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
